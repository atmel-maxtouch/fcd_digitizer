%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/microchip,atfcd52.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip ATFCD52 Fast Capacitive Digitizer (I2C control interface)

maintainers:
  - Michael Gong <michael.gong@microchip.com>

description: |
  The Microchip ATFCD52 is a fast capacitive digitizer that measures node
  capacitance on a sensor matrix. It presents two independent interfaces to
  the system host:

  This node describes the I2C control interface, which carries the
  Object-Based Protocol (OBP) and is used to configure the device and read
  its status.

  Sample data is not carried over I2C. The device streams measurement frames
  over a separate SPI frame data interface, described by its own node, see
  Documentation/devicetree/bindings/iio/adc/microchip,atfcd52-frame-data.yaml

properties:
  compatible:
    const: microchip,atfcd52

  reg:
    description:
      I2C address, selected by the ADDSEL0 and ADDSEL1 pins.
    maxItems: 1

  interrupts:
    description:
      CHG line, asserted low when an OBP message is pending.
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description:
      Reset pin, active low. The line must be flagged with GPIO_ACTIVE_LOW.

  microchip,cfg-name:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Configuration file for request_firmware(), loaded by update_cfg. The
      default is fcd52.cfg. A subdirectory relative to the firmware search
      paths may be included.

  vdd-supply:
    description: Digital supply, 1.71V to 3.47V.

  avdd-supply:
    description: Analog supply, 2.57V to 3.47V.

required:
  - compatible
  - reg
  - vdd-supply
  - avdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        digitizer@4a {
            compatible = "microchip,atfcd52";
            reg = <0x4a>;
            interrupt-parent = <&gpio>;
            interrupts = <23 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&gpio 24 GPIO_ACTIVE_LOW>;
            vdd-supply = <&reg_3v3>;
            avdd-supply = <&reg_3v3>;
            microchip,cfg-name = "fcd52.cfg";
        };
    };
...
