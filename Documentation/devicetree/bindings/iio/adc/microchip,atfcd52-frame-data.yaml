%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/microchip,atfcd52-frame-data.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip ATFCD52 SPI frame data interface

maintainers:
  - Michael Gong <michael.gong@microchip.com>

description: |
  The Microchip ATFCD52 fast capacitive digitizer streams measurement frames
  to the system host over a dedicated SPI interface. The digitizer drives
  this interface as the SPI host: it asserts SS, generates SCK and shifts
  data out on MOSI. There is no MISO line, so the flow of data is
  unidirectional, and there is no interrupt line.

  This node therefore does not describe an SPI peripheral. It describes the
  SoC SPI block that receives the stream, which is placed in client mode and
  drained by a cyclic DMA transfer. The block is owned exclusively by this
  driver and must not also be described with a generic SPI controller
  compatible, since both drivers would program the same registers.

  The frame format carries no addressing, so the sensor geometry and frame
  format are not given here. The driver reads them from the Fast Capacitive
  Digitizer T700 object of the digitizer, through the control node referenced
  by microchip,control, described in
  Documentation/devicetree/bindings/iio/adc/microchip,atfcd52.yaml. The
  control node must be bound before this driver can probe; until it is, the
  probe is deferred.

properties:
  compatible:
    const: microchip,atfcd52-frame-data

  reg:
    description: SPI block registers.
    maxItems: 1

  clocks:
    description: Peripheral bus clock for the SPI block.
    maxItems: 1

  dmas:
    description: RX DMA channel draining the SPI receive register.
    maxItems: 1

  dma-names:
    const: rx

  microchip,control:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The digitizer's I2C control node (compatible microchip,atfcd52). The
      frame layout (matrix size, data type and CRC) is read from its T700
      object.

required:
  - compatible
  - reg
  - clocks
  - dmas
  - dma-names
  - microchip,control

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/at91.h>
    #include <dt-bindings/dma/at91.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        atfcd52: digitizer@4b {
            compatible = "microchip,atfcd52";
            reg = <0x4b>;
            vdd-supply = <&reg_3v3>;
            avdd-supply = <&reg_3v3>;
            microchip,cfg-name = "fcd52.cfg";
        };
    };

    flexcom@e2018000 {
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0xe2018000 0x800>;

        atfcd52-frame-data@400 {
            compatible = "microchip,atfcd52-frame-data";
            reg = <0x400 0x200>;
            clocks = <&pmc PMC_TYPE_PERIPHERAL 38>;
            dmas = <&dma0 AT91_XDMAC_DT_PERID(13)>;
            dma-names = "rx";
            microchip,control = <&atfcd52>;
        };
    };
...
